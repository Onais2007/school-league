<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>إدارة · دوري المدرسة لكرة القدم</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;900&display=swap">
<style>
/* Layout: floodlit stadium night. Pitch-striped hero with field markings, scoreboard-style bracket per grade, gold champions-league finale. Single dark look by design. */
:root{
 --night:#07130d;--turf:#0d2a1b;--turf2:#123a26;--panel:#0f2219;--panel2:#16301f;
 --chalk:#f2f7f3;--muted:#93ad9f;--line:#24412f;--gold:#f2c14e;--gold-deep:#c8902a;--win:#2fd27a;
 --g3:#2fd27a;--g2:#4fb3ff;--g1:#ff8a4c;
 --f-display:"Lalezar","Tajawal",system-ui,sans-serif;--f-body:"Tajawal",system-ui,sans-serif;
 color-scheme:dark;
}
*{box-sizing:border-box}
html,body{direction:rtl}
body{background:var(--night);color:var(--chalk);font-family:var(--f-body);font-size:15px;line-height:1.6;
 background-image:radial-gradient(ellipse 60% 40% at 15% 0%,rgba(242,193,78,.10),transparent 70%),radial-gradient(ellipse 60% 40% at 85% 0%,rgba(242,193,78,.10),transparent 70%)}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:18px 56px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:22px 24px 30px;isolation:isolate;
 background:repeating-linear-gradient(90deg,var(--turf) 0 70px,var(--turf2) 70px 140px);border:1px solid var(--line)}
.hero::before{content:"";position:absolute;inset:14px;border:2px solid rgba(242,247,243,.18);border-radius:10px;z-index:-1}
.hero::after{content:"";position:absolute;left:50%;top:50%;width:220px;height:220px;transform:translate(-50%,-50%);border:2px solid rgba(242,247,243,.16);border-radius:50%;z-index:-1;
 box-shadow:0 0 0 0 transparent}
.hero .mid{position:absolute;left:50%;top:14px;bottom:14px;border-left:2px solid rgba(242,247,243,.16);z-index:-1}
.hero .glow{position:absolute;inset:-40% -10% auto;height:120%;background:radial-gradient(ellipse at 50% 0%,rgba(255,255,230,.18),transparent 60%);z-index:-1;pointer-events:none}
.logos{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logos img{height:70px;width:auto;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.htxt{text-align:center;margin-top:8px}
.kicker{display:inline-block;font-weight:700;letter-spacing:.02em;font-size:13px;color:var(--night);background:var(--gold);padding:3px 14px;border-radius:999px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(38px,8vw,84px);line-height:1.05;margin:10px 0 4px;text-wrap:balance;
 color:var(--chalk);text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 40px rgba(242,193,78,.25)}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero .sub{color:#cfe2d6;font-size:15px}
.ball{width:54px;height:54px;margin:6px auto 0;display:block;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ball{animation:none}}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.stat{background:rgba(7,19,13,.65);border:1px solid rgba(242,247,243,.15);border-radius:12px;padding:6px 16px;text-align:center;min-width:96px}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:26px;color:var(--gold);line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
@media(max-width:560px){.logos img{height:48px;padding:4px 6px}.hero{padding:16px 14px 22px}}

.mode{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 4px}
.live{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--win);box-shadow:0 0 8px var(--win)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools button,nav.tabs button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--panel);color:var(--chalk);border-radius:999px;padding:6px 14px;cursor:pointer}
.tools button[aria-pressed="true"],nav.tabs button[aria-selected="true"]{background:var(--gold);color:var(--night);border-color:transparent}
.tools .danger{color:#ff7b6b}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
nav.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}

/* sections */
.gsec{margin-top:34px}
.shead{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.shead .badge{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-display);font-size:24px;color:var(--night);background:var(--c);flex:none;transform:rotate(-4deg)}
.shead h2{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,4vw,38px);margin:0;line-height:1.1}
.shead p{margin:0;color:var(--muted);font-size:13px}
.shead .rule{flex:1;height:2px;background:linear-gradient(to left,var(--c),transparent);opacity:.6}

/* bracket */
.bw{overflow-x:auto;padding-bottom:6px;border-radius:18px}
.pitch{background:radial-gradient(ellipse at center,rgba(47,210,122,.06),transparent 70%),var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 6px;min-width:940px;position:relative}
.br{display:grid;grid-template-columns:1.25fr 1fr 1.1fr 1fr 1.25fr;align-items:stretch}
.col{display:flex;flex-direction:column;justify-content:space-around;gap:20px;padding:0 12px;position:relative}
.col.c{justify-content:center}
.node{background:linear-gradient(180deg,var(--panel2),#0b1a12);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative;box-shadow:0 8px 22px rgba(0,0,0,.3)}
.node .lab{font-size:11px;color:var(--muted);padding:5px 10px;display:flex;justify-content:space-between;gap:6px;background:rgba(0,0,0,.25);border-bottom:1px solid var(--line)}
.node .lab b{color:var(--c);font-weight:700}
.tr{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;gap:8px;font-weight:700;font-variant-numeric:tabular-nums}
.tr+.tr{border-top:1px solid var(--line)}
.tr .nm{display:flex;align-items:center;gap:9px;min-width:0;overflow-wrap:anywhere}
.shirt{width:30px;height:30px;flex:none;color:var(--c)}
.shirt text{font:700 9px var(--f-body);fill:var(--night)}
.tr.tbd{color:var(--muted);font-weight:500}.tr.tbd .shirt{color:var(--line)}
.tr.win{background:linear-gradient(to left,transparent,rgba(47,210,122,.14))}
.tr.win .sc{color:var(--win)}
.tr.lose{opacity:.55}
.sc{font-family:var(--f-display);font-weight:400;font-size:22px;min-width:28px;text-align:center;background:#06100a;border-radius:6px;padding:0 6px;line-height:1.35}
.sc:empty{background:transparent}
.col.l::after,.col.r::before{content:"";position:absolute;top:26%;bottom:26%;border-inline-start:2px dashed var(--line)}
.col.l::after{left:0}.col.r::before{right:0}
.node.fin{border:2px solid var(--gold);box-shadow:0 0 30px rgba(242,193,78,.18)}
.node.fin .lab{color:var(--gold)}
.trophy{text-align:center;margin-top:14px}
.trophy svg{width:54px;height:54px;display:block;margin:0 auto 2px;filter:drop-shadow(0 0 12px rgba(242,193,78,.45))}
.trophy span{font-size:12px;color:var(--muted);display:block}
.trophy b{font-family:var(--f-display);font-weight:400;font-size:24px;color:var(--gold)}

/* upcoming */
.up{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.fix{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;border-inline-start:5px solid var(--c)}
.fix .vs{font-family:var(--f-display);font-size:22px}
.fix .vs i{font-style:normal;color:var(--gold);margin:0 8px;font-size:16px}

/* champions league */
.cl{position:relative;border-radius:22px;padding:22px 18px;overflow:hidden;border:1px solid rgba(242,193,78,.4);
 background:radial-gradient(ellipse at 50% -10%,rgba(242,193,78,.22),transparent 60%),linear-gradient(160deg,#1a1505,#0b130d 55%)}
.cl::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% -20%,rgba(242,193,78,.06) 0 6deg,transparent 6deg 14deg);pointer-events:none}
.clteams{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;position:relative}
@media(max-width:700px){.clteams{grid-template-columns:repeat(2,1fr)}}
.clt{text-align:center;background:rgba(0,0,0,.35);border:1px solid rgba(242,193,78,.3);border-radius:16px;padding:12px 8px}
.clt .shirt{width:46px;height:46px;margin:0 auto}
.clt b{display:block;font-family:var(--f-display);font-weight:400;font-size:20px;margin-top:4px}
.clt span{font-size:12px;color:var(--muted)}
.clt.lead{border-color:var(--gold);box-shadow:0 0 24px rgba(242,193,78,.25)}
.clgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;margin-top:16px;position:relative}
@media(max-width:820px){.clgrid{grid-template-columns:1fr}}
.clm{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.big{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,5vw,44px);color:var(--gold);text-align:center;line-height:1.2}

.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12px}
td:first-child,th:first-child{text-align:right}
tr.best td{background:rgba(242,193,78,.12)}
tr.best td:first-child{color:var(--gold);font-weight:700}
.board{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.board h3{margin:0 0 6px;font-size:15px;color:var(--gold)}

.rules{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 20px}
.rules h3{margin:0 0 8px;font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--gold)}
.rules ol{margin:0;padding-inline-start:20px}.rules li{margin:4px 0}
footer{margin-top:28px;text-align:center;color:var(--muted);font-size:12px}

/* admin */
.sec{display:flex;flex-direction:column;gap:16px}
.sec h2{font-family:var(--f-display);font-weight:400;margin:0;font-size:28px;color:var(--c)}
h3{margin:0 0 8px;font-size:16px}
.note{color:var(--muted);font-size:13px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card.grp{border-top:4px solid var(--c)}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gh .badge{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:rgba(47,210,122,.15);color:var(--win)}
.gh .badge.wait{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.m{display:grid;grid-template-columns:1fr 46px 14px 46px 1fr;align-items:center;gap:4px;margin-top:8px;font-variant-numeric:tabular-nums}
.m .t{font-weight:700;overflow-wrap:anywhere}.m .t.r{text-align:left}
.m input,.pen input{width:46px;text-align:center;font:inherit;font-weight:700;padding:4px;border:1px solid var(--line);border-radius:8px;background:#06100a;color:var(--chalk)}
.m .x{text-align:center;color:var(--muted)}
.meta{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:2px}
.meta input{font:inherit;font-size:12px;border:none;border-bottom:1px dashed var(--line);background:transparent;color:var(--muted);width:100%;min-width:0}
.pen{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--gold);margin-top:6px}
.res{margin-top:8px;font-size:13px;font-weight:700;color:var(--win)}
.bracket{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.bracket{grid-template-columns:1fr}}
.final{border:2px solid var(--gold)}
.champ{text-align:center;font-family:var(--f-display);font-size:22px;color:var(--gold);padding:10px;border:1px dashed var(--gold);border-radius:12px}
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.setup label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.setup input{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#06100a;color:var(--chalk)}
summary{cursor:pointer}
.rays{position:fixed;inset:0;pointer-events:none;z-index:40;mix-blend-mode:screen;
 background:repeating-conic-gradient(from 0deg at var(--rx,50%) var(--ry,100%),rgba(255,214,110,.2) 0 4deg,transparent 4deg 11deg);animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.12}50%{opacity:.85}}
.cupbig{z-index:45;width:260px;height:300px;max-width:100%;margin:0 auto 6px;position:relative}
.cupbig canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
.cupbig::after{content:"";position:absolute;left:18%;right:18%;bottom:4px;height:16px;border-radius:50%;background:radial-gradient(rgba(242,193,78,.45),transparent 70%);filter:blur(4px)}
@media (prefers-reduced-motion:reduce){.rays{animation:none;opacity:.45}.ticker .run{animation:none!important}}

/* ticker */
.ticker{margin-top:14px;display:flex;align-items:stretch;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.ticker .tag{background:#d63b2f;color:#fff;font-weight:900;padding:8px 14px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.ticker .tag::before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.ticker .vp{overflow:hidden;flex:1;min-width:0;display:flex;align-items:center}
.ticker .run{display:flex;gap:40px;white-space:nowrap;padding-inline:20px;animation:tick var(--dur,40s) linear infinite;will-change:transform}
.ticker .run span b{color:var(--gold)}
.ticker .run{width:max-content}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(50%)}}
/* countdown */
.cd{margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(110deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:12px 18px}
.cd .who{font-family:var(--f-display);font-size:24px}.cd .who i{font-style:normal;color:var(--gold);margin:0 8px;font-size:16px}
.cd .clock{display:flex;gap:8px}
.cd .u{background:#06100a;border:1px solid var(--line);border-radius:10px;min-width:58px;text-align:center;padding:4px 6px}
.cd .u b{display:block;font-family:var(--f-display);font-weight:400;font-size:28px;color:var(--gold);line-height:1.1;font-variant-numeric:tabular-nums}
.cd .u span{font-size:11px;color:var(--muted)}
/* awards */
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:12px}
.aw{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.aw h4{margin:0 0 8px;font-size:14px;color:var(--c);display:flex;align-items:center;gap:6px}
.lead1{display:flex;align-items:center;gap:12px;padding:6px 0 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.av{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:#06100a;flex:none;display:grid;place-items:center;font-family:var(--f-display);color:var(--gold);font-size:22px}
.av.sm{width:30px;height:30px;font-size:13px;border-width:1.5px}
.lead1 b{font-size:17px;display:block}.lead1 small{color:var(--muted)}
.rk{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:14px;font-variant-numeric:tabular-nums}
.rk span:first-child{min-width:0;overflow-wrap:anywhere}.rk b{color:var(--gold)}
.fun{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fun div{background:rgba(0,0,0,.25);border-radius:10px;padding:8px}
.fun small{color:var(--muted);display:block;font-size:11px}.fun b{font-size:15px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.bdg{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;border:1px solid var(--gold);color:var(--gold)}
.bdg.cs{border-color:var(--g2);color:var(--g2)}.bdg.bw{border-color:var(--g1);color:var(--g1)}
/* clickable */
.node{cursor:pointer;transition:transform .15s}.node:hover{transform:translateY(-2px)}
.tr .nm[data-tm]{cursor:pointer}
.mvp{display:flex;align-items:center;gap:6px;padding:4px 10px;font-size:12px;color:var(--gold);background:rgba(242,193,78,.08);border-top:1px solid var(--line)}
/* modal */
.ov{position:fixed;inset:0;z-index:60;background:rgba(3,8,5,.78);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.md{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:100%;max-width:620px;padding:18px;position:relative}
.md .x{position:absolute;top:10px;left:10px;font:inherit;background:var(--panel2);color:var(--chalk);border:1px solid var(--line);border-radius:999px;width:34px;height:34px;cursor:pointer}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center;margin:10px 0}
.score .tm{font-family:var(--f-display);font-size:22px;cursor:pointer}
.score .res{font-family:var(--f-display);font-size:44px;color:var(--gold);direction:ltr;background:#06100a;border-radius:12px;padding:0 14px}
.block{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.block h4{margin:0 0 8px;font-size:15px;color:var(--gold)}
.cands{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cand{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.cand .av{width:72px;height:72px;margin:0 auto 6px}
.cand.top{border-color:var(--gold);box-shadow:0 0 18px rgba(242,193,78,.2)}
.cand button{font:inherit;font-weight:700;margin-top:6px;width:100%;border-radius:999px;border:1px solid var(--gold);background:transparent;color:var(--gold);padding:4px;cursor:pointer}
.cand button.on{background:var(--gold);color:var(--night)}
.bar{height:6px;border-radius:3px;background:#06100a;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--gold)}
.pred{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pred input{width:52px;text-align:center;font:inherit;font-weight:700;font-size:18px;padding:4px;border:1px solid var(--line);border-radius:8px;background:#06100a;color:var(--chalk)}
.pred button,.btn{font:inherit;font-weight:700;border-radius:999px;border:none;background:var(--gold);color:var(--night);padding:6px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--chalk);border:1px solid var(--line)}
.mini{font-size:12px;color:var(--muted)}
.fix .pred input{width:40px;font-size:15px}
.ed-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) 70px 34px;gap:6px;margin-top:6px}
.ed-row.c4{grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) 70px 64px minmax(0,1.3fr) 34px}
@media(max-width:640px){.ed-row.c4{grid-template-columns:1fr 1fr 1fr;}}
.ed-row input,.ed-row select,.edsel{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#06100a;color:var(--chalk);min-width:0;width:100%}
.ed-row button{font:inherit;border:1px solid var(--line);background:transparent;color:#ff7b6b;border-radius:8px;cursor:pointer}

@media(max-width:820px){.clgrid{grid-template-columns:minmax(0,1fr)!important}}
.clm{min-width:0}
</style>
<style>html,body{margin:0}</style>
</head>
<body>


<div class="wrap" dir="rtl" lang="ar" style="position:relative;z-index:1">

function makeTrophy(W,H){const T=THREE;
 const r=new T.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});r.setPixelRatio(Math.min(window.devicePixelRatio||1,2));r.setSize(W,H,false);
 r.outputEncoding=T.sRGBEncoding;r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1.45;
 const sc=new T.Scene();
 // studio environment for reflections
 const cv=document.createElement("canvas");cv.width=1024;cv.height=512;const x=cv.getContext("2d");
 let gr=x.createLinearGradient(0,0,0,512);gr.addColorStop(0,"#fff9ea");gr.addColorStop(.35,"#c9b48a");gr.addColorStop(.55,"#8a6630");gr.addColorStop(1,"#2a1d0c");x.fillStyle=gr;x.fillRect(0,0,1024,512);
 x.fillStyle="#ffffff";[[120,60],[520,40],[800,70]].forEach(([a,w])=>{x.globalAlpha=.9;x.fillRect(a,40,w,230)});
 x.globalAlpha=.6;x.fillStyle="#ffd27a";x.fillRect(320,300,260,40);x.globalAlpha=1;
 const tex=new T.CanvasTexture(cv);tex.mapping=T.EquirectangularReflectionMapping;tex.encoding=T.sRGBEncoding;
 const pm=new T.PMREMGenerator(r);const env=pm.fromEquirectangular(tex).texture;sc.environment=env;
 const gold=new T.MeshStandardMaterial({color:0xffc53d,metalness:1,roughness:.2,side:T.DoubleSide});
 const goldIn=new T.MeshStandardMaterial({color:0xb7791f,metalness:1,roughness:.35,side:T.BackSide});
 const dark=new T.MeshStandardMaterial({color:0x0d1015,metalness:0,roughness:.6,envMapIntensity:.15});
 const dark2=new T.MeshStandardMaterial({color:0x07090c,metalness:0,roughness:.7,envMapIntensity:.1});
 const V=(a,b)=>new T.Vector2(a,b),g=new T.Group();
 // plinth + base block
 const pl=new T.Mesh(new T.BoxGeometry(3.05,.3,2.0),dark2);pl.position.y=.15;g.add(pl);
 const bs=new T.Mesh(new T.BoxGeometry(2.65,1.3,1.7),dark);bs.position.y=.95;g.add(bs);
 const plate=new T.Mesh(new T.BoxGeometry(1.85,.62,.04),gold);plate.position.set(0,1.0,.87);g.add(plate);
 // stem, collar, bowl
 const stem=new T.SplineCurve([V(1.05,1.6),V(.85,1.75),V(.5,2.1),V(.33,2.55),V(.32,2.9),V(.5,3.0),V(.62,3.15),V(.6,3.33),V(.5,3.45),V(.75,3.52),V(1.25,3.75),V(1.58,4.25),V(1.74,4.95),V(1.8,5.8),V(1.82,6.55)]).getPoints(120);
 const prof=[V(0,1.6),...stem,V(1.88,6.62),V(1.86,6.68)];
 g.add(new T.Mesh(new T.LatheGeometry(prof,160),gold));
 const inner=new T.LatheGeometry([V(1.76,6.66),V(1.72,6.0),V(1.55,5.0),V(1.0,4.2),V(0,3.95)],120);g.add(new T.Mesh(inner,goldIn));
 // scroll handles
 [1,-1].forEach(s=>{const pts=[[2.1,6.4],[1.93,6.66],[2.12,6.93],[2.6,6.98],[2.97,6.6],[2.93,5.98],[2.57,5.3],[2.12,4.75],[1.95,4.42],[2.08,4.2],[2.3,4.3]].map(p=>new T.Vector3(s*p[0],p[1],0));
  const tube=new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts),160,.14,20,false),gold);g.add(tube);
  [pts[0],pts[pts.length-1]].forEach(p=>{const k=new T.Mesh(new T.SphereGeometry(.17,24,16),gold);k.position.copy(p);g.add(k)});
  const arm=new T.Mesh(new T.CylinderGeometry(.09,.09,.3,16),gold);arm.rotation.z=Math.PI/2;arm.position.set(s*1.95,6.35,0);g.add(arm);
  const arm2=arm.clone();arm2.position.set(s*1.85,4.45,0);g.add(arm2);});
 g.position.y=-3.5;sc.add(g);
 const k1=new T.DirectionalLight(0xffffff,.8);k1.position.set(4,6,8);sc.add(k1);
 const k2=new T.DirectionalLight(0xffd59a,.7);k2.position.set(-6,3,2);sc.add(k2);
 sc.add(new T.AmbientLight(0xffffff,.25));
 const cam=new T.PerspectiveCamera(30,W/H,.1,100);cam.position.set(0,1.0,16.3);cam.lookAt(0,.05,0);
 return {el:r.domElement,frame:a=>{g.rotation.y=a;r.render(sc,cam)}};}

const ADMIN=!!window.LEAGUE_ADMIN,LSK="school-league-admin-v1";let DIRTY=false;

async function fetchRemote(){const r=await fetch("results.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(r.status);return r.json()}

async function load(){if(ADMIN){let loc=null;try{loc=JSON.parse(localStorage.getItem(LSK))}catch(e){}

/* ---------- tournament logic ---------- */
function legs(g,gi,a,b){const m1=M(g,"G"+gi+"a"),m2=M(g,"G"+gi+"b");const sc=[n(m1.h),n(m1.a),n(m2.h),n(m2.a)];
 if(!a||!b||sc.some(x=>x===null))return null;
 const ga=sc[0]+sc[3],gb=sc[1]+sc[2];
 const res=(x,y)=>x>y?3:x==y?1:0;
 const pa=res(sc[0],sc[1])+res(sc[3],sc[2]),pb=res(sc[1],sc[0])+res(sc[2],sc[3]);
 let w=null;if(ga!=gb)w=ga>gb?0:1;else{const pp=M(g,"G"+gi+"p"),x=n(pp.h),y=n(pp.a);if(x!==null&&y!==null&&x!=y)w=x>y?0:1}
 const W0=(sc[0]>sc[1])+(sc[3]>sc[2]),W1=(sc[1]>sc[0])+(sc[2]>sc[3]),D=(sc[0]==sc[1])+(sc[2]==sc[3]);
 const rows=[{t:a,P:2,W:W0,D,L:2-W0-D,F:ga,A:gb,Pts:pa},{t:b,P:2,W:W1,D,L:2-W1-D,F:gb,A:ga,Pts:pb}].map(r=>({...r,GD:r.F-r.A}));
 return {w:w===null?null:[a,b][w],l:w===null?null:[a,b][1-w],lrow:w===null?null:rows[1-w],tied:ga==gb,rows}}
function single(g,id,a,b){const m=M(g,id),x=n(m.h),y=n(m.a);if(!a||!b||x===null||y===null)return {done:false};
 if(x!=y)return {done:true,w:x>y?a:b};const p=M(g,id+"p"),px=n(p.h),py=n(p.a);
 if(px!==null&&py!==null&&px!=py)return {done:true,w:px>py?a:b,pen:true};return {done:false,tied:true}}
const CMP={};
function compute(g){const T=S.grades[g].teams,R={};
 R.g=[[T[0],T[1]],[T[2],T[3]],[T[4],T[5]]].map((p,i)=>legs(g,i+1,p[0],p[1]));
 const losers=R.g.map(r=>r&&r.lrow).filter(Boolean);R.best=null;
 if(losers.length==3){const s=[...losers].sort((a,b)=>b.Pts-a.Pts||b.GD-a.GD||b.F-a.F);
  const tie=s[0].Pts==s[1].Pts&&s[0].GD==s[1].GD&&s[0].F==s[1].F;R.bestTie=tie;R.best=tie?(S.grades[g].draw||null):s[0].t;R.losers=s}
 R.g.push(legs(g,4,T[6],R.best));R.W=R.g.map(r=>r&&r.w);
 R.s1=single(g,"S1",R.W[0],R.W[1]);R.s2=single(g,"S2",R.W[2],R.W[3]);R.f=single(g,"F",R.s1.w,R.s2.w);return R}
const CLP=[[0,1],[2,3],[0,2],[1,3],[0,3],[1,2]];
function clIds(){return [...GK.map(g=>compute(g).f.w||null),"T"]}
/* every match in one list */
function allMatches(){const L=[];
 for(const g of GK){const T=S.grades[g].teams,R=compute(g),G=GR[g];
  const add=(id,a,b,label,stage)=>{const m=M(g,id),p=M(g,id+(id.startsWith("G")?"":"p"));const x=n(m.h),y=n(m.a);
   L.push({key:g+"|"+id,g,id,a,b,label,stage,gname:G.name,c:G.c,x,y,done:x!==null&&y!==null&&!!a&&!!b,note:m.d||"",dt:X(g+"|"+id).dt||""})};
  [[1,0,1],[2,2,3],[3,4,5]].forEach(([i,p,q])=>{add("G"+i+"a",T[p],T[q],"المجموعة "+i+" · ذهاب","grp");add("G"+i+"b",T[q],T[p],"المجموعة "+i+" · إياب","grp")});
  add("G4a",T[6],R.best,"المجموعة 4 · ذهاب","grp");add("G4b",R.best,T[6],"المجموعة 4 · إياب","grp");
  add("S1",R.W[0],R.W[1],"نصف النهائي","ko");add("S2",R.W[2],R.W[3],"نصف النهائي","ko");add("F",R.s1.w,R.s2.w,"النهائي","ko")}
 const ids=clIds();CLP.forEach((p,k)=>{const m=S.cup.m[k]||{};const x=n(m.h),y=n(m.a),a=ids[p[0]],b=ids[p[1]];
  L.push({key:"cup|"+k,g:"cup",id:k,a,b,label:"الجولة "+(Math.floor(k/2)+1),stage:"cl",gname:"دوري الأبطال",c:"var(--gold)",x,y,done:x!==null&&y!==null&&!!a&&!!b,note:m.d||"",dt:X("cup|"+k).dt||""})});
 return L}
function findM(key){return allMatches().find(m=>m.key==key)}

/* ---------- awards ---------- */
function voteTally(key){const t={};let tot=0;(X(key).cand||[]).forEach((c,i)=>{const v=Math.max(0,+(c&&c.v)||0);t[i]=v;tot+=v});return {t,tot}}
function mvpOf(key){const c=(X(key).cand||[]).filter(x=>x&&x.n);if(!c.length)return null;const {t,tot}=voteTally(key);
 const rows=c.map((p,i)=>{const share=tot?(t[i]||0)/tot:0,r=Math.max(0,Math.min(10,+p.r||0));return {...p,i,votes:t[i]||0,share,score:Math.round((0.7*r/10+0.3*share)*1000)/10}});
 rows.sort((a,b)=>b.score-a.score);return {rows,tot,top:rows[0]}}
function stageAwards(g){const ms=allMatches().filter(m=>m.g==g);const sc={},pl={};
 ms.forEach(m=>{(X(m.key).sc||[]).forEach(s=>{if(!s||!s.n)return;const team=s.s==1?m.b:m.a;const k=s.n+"|"+team;(sc[k] ||= {n:s.n,team,g:0}).g+=(+s.g||0)});
  if(m.done){const mv=mvpOf(m.key);if(mv&&mv.top){const p=mv.top,team=p.s==1?m.b:m.a,k=p.n+"|"+team;const o=(pl[k] ||= {n:p.n,team,mvp:0,pts:0,pid:null});o.mvp++;o.pts+=p.score;if(p.pid)o.pid=p.pid}}});
 return {scorers:Object.values(sc).sort((a,b)=>b.g-a.g).slice(0,5),players:Object.values(pl).sort((a,b)=>b.mvp-a.mvp||b.pts-a.pts).slice(0,3)}}
function badgesOf(m){const B=[];if(!m.done)return B;
 (X(m.key).sc||[]).forEach(s=>{if(s&&+s.g>=3)B.push({t:"هاتريك: "+s.n,c:""})});
 if(m.y===0)B.push({t:"شباك نظيفة: "+tname(m.a),c:"cs"});if(m.x===0)B.push({t:"شباك نظيفة: "+tname(m.b),c:"cs"});
 if(Math.abs(m.x-m.y)>=3)B.push({t:"فوز عريض",c:"bw"});return B}
function funStats(g){const ms=allMatches().filter(m=>m.g==g&&m.done);if(!ms.length)return null;const t={};
 ms.forEach(m=>{[[m.a,m.x,m.y],[m.b,m.y,m.x]].forEach(([id,f,a])=>{const o=(t[id] ||= {id,F:0,A:0,P:0});o.F+=f;o.A+=a;o.P++})});
 const T=Object.values(t);const att=[...T].sort((a,b)=>b.F-a.F)[0],def=[...T].sort((a,b)=>a.A/a.P-b.A/b.P)[0];
 const big=[...ms].sort((a,b)=>Math.abs(b.x-b.y)-Math.abs(a.x-a.y))[0],hi=[...ms].sort((a,b)=>(b.x+b.y)-(a.x+a.y))[0];
 return {att,def,big,hi}}
function predBoard(){const ms=allMatches().filter(m=>m.done);const rows=[];
 for(const u in PREDS){let pts=0,ex=0,cnt=0;ms.forEach(m=>{const p=PREDS[u][m.key];if(!p)return;cnt++;const[h,a]=p;
  if(h==m.x&&a==m.y){pts+=3;ex++}else if(Math.sign(h-a)==Math.sign(m.x-m.y))pts+=1});rows.push({u,pts,ex,cnt})}
 return rows.filter(r=>r.cnt).sort((a,b)=>b.pts-a.pts||b.ex-a.ex).slice(0,10)}
function predOpen(m){if(m.done||!m.a||!m.b)return false;if(m.dt&&new Date(m.dt).getTime()<=Date.now())return false;return true}

function gnode(g,i,a,b,r,extra){const k1=g+"|G"+i+"a",k2=g+"|G"+i+"b",m1=M(g,"G"+i+"a"),m2=M(g,"G"+i+"b");
 const v=[n(m1.h),n(m1.a),n(m2.h),n(m2.a)],any=v.some(x=>x!==null),A=(v[0]??0)+(v[3]??0),B=(v[1]??0)+(v[2]??0),w=r&&r.w;
 const p=M(g,"G"+i+"p"),cls=t=>!t?"tbd":w?(w==t?"win":"lose"):"";

 if(b.id=="cp"){io.hidden=false;io.value=JSON.stringify(payload());io.select();navigator.clipboard?.writeText(io.value).then(()=>msg.textContent="نُسخ الرمز.").catch(()=>msg.textContent="حدّد النص وانسخه يدويًا.")}
 if(b.id=="ld"){if(io.hidden){io.hidden=false;io.value="";msg.textContent="الصق الرمز ثم اضغط استيراد مرة أخرى.";return}try{absorb(JSON.parse(io.value));save();render()}catch(err){msg.textContent="الرمز غير صالح. تأكد من نسخه كاملًا."}}
 if(b.id=="rs"){if(b.dataset.c){absorb(blank());save();render()}else{b.dataset.c=1;b.textContent="اضغط مرة أخرى للتأكيد"}}});

 if(t.dataset.photo!=null&&t.files&&t.files[0]){const i=+t.dataset.photo,file=t.files[0],msg=document.getElementById("phmsg");msg.textContent="جارٍ تجهيز الصورة…";

   const pid="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
   try{(S.photos ||= {})[pid]=d;PHOTOS=S.photos;X(EDKEY).cand[i].pid=pid;save();render();document.getElementById("phmsg").textContent="رُفعت الصورة."}catch(err){msg.textContent="تعذّر رفع الصورة. جرّب صورة أخرى."}};
  img.onerror=()=>msg.textContent="تعذّر قراءة الصورة.";img.src=URL.createObjectURL(file)}});

let TR=null;
function mountGL(){const c=document.getElementById("schoolcup");if(!c)return;if(!TR&&window.THREE){try{TR=makeTrophy(260,300)}catch(e){TR=false}}
 if(TR&&TR.el.parentNode!==c)c.appendChild(TR.el);if(TR===false&&!c.innerHTML)c.innerHTML=CUP}
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
(function tick(t){mountGL();const c=document.getElementById("schoolcup"),r=document.getElementById("rays");
 if(r)r.hidden=!c;if(c&&r){const b=c.getBoundingClientRect();r.style.setProperty("--rx",(b.left+b.width/2)+"px");r.style.setProperty("--ry",(b.top+b.height*0.42)+"px");
  if(TR&&b.bottom>-50&&b.top<innerHeight+50)TR.frame(still?0.5:(t||0)*0.0008)}
 requestAnimationFrame(tick)})();
document.documentElement.dir="rtl";document.documentElement.lang="ar";
render();
